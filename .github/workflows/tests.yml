# Formwert: Browser-Tests der App unter app/ bei jedem Push auf main und jedem Pull Request.
# Die Tests selbst stehen in tests/formwert-tests.js.
name: Tests

on:
  push:
    branches: [main]
    paths: ["app/**", "tests/**", ".github/workflows/tests.yml"]
  pull_request:
    paths: ["app/**", "tests/**", ".github/workflows/tests.yml"]
  workflow_dispatch:

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Playwright installieren
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Tests
        run: node tests/formwert-tests.js
